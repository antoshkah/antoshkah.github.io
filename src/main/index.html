<!doctype html>
<html lang="en">
  <head>
    <script>try{if(sessionStorage.getItem("site-fade-in")==="1"){sessionStorage.removeItem("site-fade-in");document.documentElement.classList.add("page-enter")}}catch(e){}</script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>main</title>
    <link rel="icon" type="image/png" href="../images/favicon.png" />
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body>
    <main class="center">
      <section class="about-card">
        <button class="kirby" id="kirby" type="button" aria-label="say hi to kirby">
          <span class="kirby-sprite" aria-hidden="true"></span>
        </button>
        <nav class="links" aria-label="Primary">
          <a class="link wip wip-app" href="../app/" data-shortcut-key="a" aria-label="app"><span class="wip-cut" aria-hidden="true">a</span><span class="wip-cut" aria-hidden="true">p</span><span class="wip-cut" aria-hidden="true">p</span></a>
          <a class="link" href="../about/" data-shortcut-key="b">.about</a>
        </nav>
      </section>
      <div class="page-footer">
        <button class="icon-button site-theme-toggle" id="site-theme-toggle" type="button" aria-label="switch to dark mode">
          <span class="site-theme-toggle-icon" aria-hidden="true"></span>
        </button>
        <a class="icon-button" href="../clock/" aria-label="clock">
          <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="9"></circle>
            <polyline points="12 7 12 12 15.5 14"></polyline>
          </svg>
        </a>
      </div>
    </main>
    <script src="../script.js"></script>
  </body>
</html>
