<!doctype html>
<!-- dev only (outside src/, so it's never deployed): shows the stats app in a 9:16 phone-shaped frame.
     open with Live Server → /dev/phone.html. for real touch / user-agent emulation, use DevTools' device toolbar
     (F12, then Ctrl+Shift+M) instead. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>stats · phone frame</title>
    <style>
      html, body { margin: 0; height: 100%; background: #2a2a2a; }
      body { display: grid; place-items: center; }
      /* 9:16, as tall as the window allows (minus a little margin) */
      .phone {
        height: min(92vh, calc(92vw * 16 / 9));
        aspect-ratio: 9 / 16;
        border: 10px solid #000;
        border-radius: 28px;
        overflow: hidden;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      }
      iframe { display: block; width: 100%; height: 100%; border: 0; }
      .size { position: fixed; bottom: 10px; left: 0; right: 0; text-align: center; font: 12px monospace; color: #888; }
    </style>
  </head>
  <body>
    <div class="phone"><iframe id="app" src="../src/stats/index.html" title="stats"></iframe></div>
    <div class="size" id="size"></div>
    <script>
      // shows the frame's size in CSS pixels (a real phone in portrait is ~360–430 wide)
      const show = () => {
        const r = document.getElementById("app").getBoundingClientRect();
        document.getElementById("size").textContent = `${Math.round(r.width)} × ${Math.round(r.height)} (9:16)`;
      };
      addEventListener("resize", show);
      show();
    </script>
  </body>
</html>
