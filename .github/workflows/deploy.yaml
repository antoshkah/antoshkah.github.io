name: Deploy to GitHub Pages

# only the release branch goes live; develop (and main) never deploy
on:
  push:
    branches: [ release ]
    paths:
      - 'src/**'
      - '.github/workflows/deploy.yaml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/release' # manual runs from any other branch do nothing
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # work-in-progress mode: publish only the front page and what it needs, so the other
      # sections (main/, about/, app/, clock/, misc/) stay in the repo but aren't on the site
      - name: Collect front page
        run: |
          mkdir -p _site/images
          cp src/index.html src/style.css src/script.js _site/
          cp -r src/fonts _site/
          cp src/images/favicon.png src/images/mc-cat.png src/images/kirby-sprite.png _site/images/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
